name: Apply editor focus race fix
on:
  push:
    branches: ['fix/activity-types-v2.2.1']
    paths: ['.github/workflows/fix-editor-focus.yml']
permissions:
  contents: write
jobs:
  patch-source:
    if: github.repository == '1337816143/Activity-Log' && github.ref == 'refs/heads/fix/activity-types-v2.2.1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/activity-types-v2.2.1
      - name: Apply single assertion-checked focus fix
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/app.js')
          s=p.read_text()
          old="setTimeout(()=>form.elements.title.focus(),30);"
          new="form.elements.title.focus({preventScroll:true});"
          assert s.count(old)==1, 'Focus source changed; stop rather than overwrite unrelated code'
          p.write_text(s.replace(old,new))
          PY
          node --check assets/app.js
          git add assets/app.js
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: focus editor immediately instead of stealing focus during typing'
          git push origin HEAD:fix/activity-types-v2.2.1
