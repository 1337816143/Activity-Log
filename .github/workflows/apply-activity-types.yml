name: Apply requested activity type settings
on:
  push:
    branches: ['fix/activity-types-v2.2.1']
    paths: ['scripts/apply-activity-types.py', '.github/workflows/apply-activity-types.yml']
permissions:
  contents: write
concurrency:
  group: apply-activity-types
  cancel-in-progress: false
jobs:
  update-source:
    if: github.repository == '1337816143/Activity-Log' && github.ref == 'refs/heads/fix/activity-types-v2.2.1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/activity-types-v2.2.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply assertion-checked category edits
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/apply-activity-types.py')
          old="edit('.github/workflows/pages.yml','v2.2.0','v2.2.1',2)"
          new="edit('.github/workflows/pages.yml','v2.2.0','v2.2.1')\nedit('.github/workflows/pages.yml','?v=2.2.0','?v=2.2.1')"
          s=p.read_text();assert s.count(old)==1;p.write_text(s.replace(old,new))
          PY
          python3 scripts/apply-activity-types.py
          npm run check
          npm test
      - name: Commit application source on the feature branch
        run: |
          git restore .github/workflows/pages.yml .github/workflows/backup.yml
          git rm -f scripts/apply-activity-types.py
          git add assets index.html package.json tests README.md
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat: unify seven activity types across both interfaces and Excel import'
          git push origin HEAD:fix/activity-types-v2.2.1
