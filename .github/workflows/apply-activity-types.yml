name: Apply guarded category source edits
on:
  push:
    branches: ['feat/activity-types-v2.2.1']
    paths: ['scripts/apply-activity-types.py']
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == '1337816143/Activity-Log'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/activity-types-v2.2.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact source replacements and unit-check
        run: |
          python3 scripts/apply-activity-types.py
          sed -i "s/'类'\.repeat(50)/'类'*50/" tests/categories-e2e.py
          python3 -m py_compile tests/categories-e2e.py
          npm run check
          npm test
          git diff --check
      - name: Commit source changes only to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/app.js assets/boot.js assets/config.js assets/team-ui.js assets/excel-core.js assets/excel-worker.js index.html package.json tests/ui-modes.py tests/categories-e2e.py README.md
          git commit -m 'feat: integrate seven activity presets, custom names and draft/import persistence'
          git push origin HEAD:feat/activity-types-v2.2.1
