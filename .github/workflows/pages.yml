name: Verify and publish Activity Log
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: activity-log-pages
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check JavaScript syntax
        run: npm run check
      - name: Install browser test tooling
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Test the real app and IndexedDB
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/activity-http.log 2>&1 &
          sleep 2
          python3 tests/e2e.py
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 14
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r assets _site/
          touch _site/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the verified site
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test tooling
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify public HTTP and all primary static resources
        env:
          LIVE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          mkdir -p test-results-live
          test -n "$LIVE_URL"
          curl --fail --location --retry 8 --retry-all-errors --retry-delay 5 --max-time 25 \
            --dump-header test-results-live/http-headers.txt \
            --output test-results-live/index.html \
            --write-out '%{http_code}\n%{url_effective}\n' "$LIVE_URL" | tee test-results-live/http-status.txt
          grep -q 'assets/app.js' test-results-live/index.html
          for asset in app.js store.js deck.js ui.js demo.js style.css base.css workspace.css dialogs.css responsive.css icon.svg; do
            curl --fail --silent --show-error --location --retry 3 --retry-delay 2 --max-time 25 \
              --output /dev/null --write-out "$asset %{http_code}\n" "${LIVE_URL%/}/assets/$asset"
          done | tee test-results-live/static-resources.txt
      - name: Run all browser tests against the public site
        env:
          LIVE_URL: ${{ steps.deployment.outputs.page_url }}
          TEST_RESULTS: test-results-live
        run: python3 tests/e2e.py "$LIVE_URL"
      - name: Save deployed-site test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-site-browser-test-results
          path: test-results-live/
          retention-days: 14
