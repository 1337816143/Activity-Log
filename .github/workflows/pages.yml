name: Verify and publish Activity Log
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: activity-log-pages
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax and spreadsheet parser unit tests
        run: npm run check && npm test
      - name: Install browser test tooling
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify anonymous sharing in isolated QA namespace
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/activity-http.log 2>&1 &
          sleep 2
          python3 tests/e2e.py
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 14
      - name: Prepare static site without data or credentials
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r assets _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the verified site
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test tooling
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify public HTTP and static resources
        env:
          LIVE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          mkdir -p test-results-live
          curl --fail --location --retry 8 --retry-all-errors --retry-delay 5 --max-time 25 --dump-header test-results-live/http-headers.txt --output test-results-live/index.html "$LIVE_URL"
          grep -q 'v2.1.0' test-results-live/index.html
          for asset in app.js store.js deck.js ui.js demo.js style.css base.css workspace.css dialogs.css responsive.css team-client.js team-ui.js drafts.js config.js excel-worker.js excel-core.js team.css identity/cau-emblem.png identity/clst-official-header.png vendor/xlsx.full.min.js; do
            curl --fail --silent --show-error --location --retry 3 --retry-delay 2 --max-time 25 --output /dev/null --write-out "$asset %{http_code}\n" "${LIVE_URL%/}/assets/$asset"
          done | tee test-results-live/static-resources.txt
      - name: Verify the live shared website using two independent browsers
        env:
          LIVE_URL: ${{ steps.deployment.outputs.page_url }}
          TEST_RESULTS: test-results-live
        run: python3 tests/e2e.py "$LIVE_URL"
      - name: Save deployed-site test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-site-browser-test-results
          path: test-results-live/
          retention-days: 14
